name: CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ci-quality-gate:
    name: Run CI Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python Setup + Linting + Tests
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install flask
          pip install flake8
          pip install pytest

      - name: Run Python linting (flake8)
        run: |
          flake8 app --count --select=E,F,W --show-source --statistics

      - name: Run Python tests
        run: |
          pytest -q

      # -----------------------------
      # Terraform Formatting + Validation
      # -----------------------------
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check

      - name: Terraform Init (safe - no backend)
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate